name: Docker Publish

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]
  schedule:
    - cron: "0 0 * * 0"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build, smoke-test & push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Unit tests
        run: |
          if [ -d tests ]; then
            python3 -m unittest discover -s tests -t . -v
          else
            echo "no tests directory"
          fi

      - uses: docker/setup-buildx-action@v3

      - name: Build image for the smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: scanner:ci
          cache-from: type=gha

      # Scan a local nginx and check the records the bridge and the detection
      # rules read (type Nikto, one record per CSV row with an OSVDB column).
      - name: Smoke scan against a local nginx
        timeout-minutes: 20
        run: |
          set -euo pipefail
          docker network create smoke
          docker run -d --name web --network smoke nginx:1.27-alpine
          sleep 3
          docker run --rm --network smoke -e TARGET=web -e PORT=80 scanner:ci | tee nikto.log
          grep -F "'target': 'web', 'type': 'Nikto'" nikto.log
          grep -E "'type': 'Nikto'.*'OSVDB': 'OSVDB-[0-9]+'" nikto.log
          grep -F "'scan': 'done'" nikto.log

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        if: github.event_name != 'pull_request'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=schedule,pattern={{date 'YYYYMMDD'}}

      - name: Build and push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
